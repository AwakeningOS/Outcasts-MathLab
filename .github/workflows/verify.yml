name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Trust-boundary policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject proof placeholders and added trust
        run: python3 scripts/check_policy.py

  lean:
    name: Lean kernel verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true

  finite-regression:
    name: Exact finite regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare direct search and committed finite-result JSON
        run: python3 Problems/P001_ErdosStraus1201/check_prime_divisors.py
